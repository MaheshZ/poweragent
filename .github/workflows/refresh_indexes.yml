name: Refresh ppc64le availability indexes

on:
  schedule:
    # Run on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:   # Allow manual trigger from the Actions UI

jobs:
  refresh-indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated JSON files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx

      - name: Run refresh script (clones all 3 source repos locally)
        run: python3 gemini-elite-ai/backend/data/refresh_indexes.py

      - name: Commit updated indexes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gemini-elite-ai/backend/data/devpi_wheels_index.json \
                  gemini-elite-ai/backend/data/icr_power_images.json \
                  gemini-elite-ai/backend/data/build_scripts_index.json
          git diff --cached --quiet || git commit -m "chore: refresh ppc64le availability indexes [$(date -u '+%Y-%m-%d')]"
          git push
