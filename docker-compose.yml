services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibm-power-triage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - triage-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibm-power-triage-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - triage-net

networks:
  triage-net:
    driver: bridge
